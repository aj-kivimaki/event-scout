services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: event-scout-n8n
    ports:
      - "5679:5678"
    environment:
      - TZ=Europe/Helsinki
      - N8N_SECURE_COOKIE=false
      - N8N_EDITOR_BASE_URL=http://localhost:5679
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./config:/home/node/.n8n-files/config
    networks:
      - event-scout
    restart: unless-stopped

  python-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-scout-python-api
    ports:
      - "8000:8000"
    networks:
      - event-scout
    restart: unless-stopped

networks:
  event-scout:
    driver: bridge
